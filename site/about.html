<!doctype html>
<html lang="{{html_lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{about_title}}</title>
<meta name="description" content="{{about_desc}}">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{brand}}">
<meta property="og:title" content="{{about_title}}">
<meta property="og:description" content="{{about_desc}}">
<meta property="og:locale" content="{{og_locale}}">
{{head_extra}}
<link rel="icon" href="{{root}}favicon.svg" type="image/svg+xml">
<link rel="alternate" type="application/atom+xml" href="{{feed_href}}" title="{{brand}}">
<link rel="preload" href="{{root}}static/fonts/schibsted-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{root}}static/site.css">{{theme_css}}
</head>
<body>
<a class="skip" href="#main">{{about_h2}}</a>
{{topbar_html}}
<div class="wrap">
  <header class="page-h">
    <h1>{{about_h2}}</h1>
  </header>
  <main id="main">
  <section class="s prose" id="what" style="padding-top: 8px">
    <p>{{about_1}}</p>
    <p>{{about_2}}</p>
    <p>{{about_3}}</p>
    {{about_contact_html}}
    {{maintainer_html}}
  </section>
  </main>
</div>
{{footer_html}}
</body>
</html>
