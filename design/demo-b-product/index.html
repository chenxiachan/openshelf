<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Openshelf · demo B</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="../logo.svg" type="image/svg+xml">
<style>
@font-face { font-family: "Schibsted Grotesk"; font-weight: 400 800; font-display: swap; src: url("../../site/static/fonts/schibsted-var.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-2193, U+2212; }
@font-face { font-family: "IBM Plex Mono"; font-weight: 400; font-display: swap; src: url("../../site/static/fonts/plexmono-400.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-2193, U+2212; }
@font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: swap; src: url("../../site/static/fonts/plexmono-500.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-2193, U+2212; }
/* Celadon: quiet off-white paper, charcoal ink, one sage-green accent. Text pairs checked >= 4.5:1 in both modes. */
:root {
  --paper: #f7f8f5; --surface: #ffffff; --ink: #23282b; --muted: #646d6a; --rule: #e2e7e2; --rule-2: #d3dbd5;
  --acc: #3a6b5b; --soft: #e3efe8; --soft-2: #d3e6db; --brand: #7fb5a0; --tile: #eef1ed;
  --rebuttal: #a9503a; --replication: #8a6512; --extension: #4d7535; --discussion: #47659a;
  --shadow: 0 1px 2px rgba(35, 40, 43, .04), 0 4px 14px rgba(35, 40, 43, .04);
  --sans: "Schibsted Grotesk", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121514; --surface: #191d1c; --ink: #e3e8e5; --muted: #9aa39f; --rule: #2a302e; --rule-2: #36403c;
    --acc: #93cdb6; --soft: #20302a; --soft-2: #284036; --tile: #222826;
    --rebuttal: #f08f78; --replication: #d9b25a; --extension: #9ccc7e; --discussion: #93b2ec; --shadow: none; color-scheme: dark; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.6 var(--sans); }
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; text-decoration-color: var(--brand); text-underline-offset: 3px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; border-radius: 6px; }
.demo-note { text-align: center; font-size: 12px; color: var(--muted); padding: 6px 16px; background: var(--soft); }

/* top bar */
.bar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); }
.bar-in { max-width: 1160px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 18px; }
.logo { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
.logo svg { width: 26px; height: 26px; }
.search { flex: 1; max-width: 380px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--rule); background: var(--surface); border-radius: 10px; padding: 0 10px; }
.search svg { width: 15px; height: 15px; color: var(--muted); flex: none; }
.search input { border: 0; outline: 0; background: transparent; font: inherit; font-size: 14px; color: var(--ink); padding: 7px 0; width: 100%; }
.search:focus-within { border-color: var(--acc); }
.nav { display: flex; gap: 18px; font-size: 14px; color: var(--muted); }
.nav a.on { color: var(--ink); font-weight: 600; }
.right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.lang { border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 2px 11px; font-size: 13px; }
.submit { border: 1px solid var(--soft-2); background: var(--soft); color: var(--acc); border-radius: 10px; padding: 6px 14px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.submit:hover { background: var(--soft-2); }

/* layout */
.shell { max-width: 1160px; margin: 0 auto; padding: 0 20px 80px; }
.hero { padding: 44px 0 26px; max-width: 720px; }
.hero h1 { font-size: 34px; line-height: 1.15; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 10px; text-wrap: balance; }
.hero p { margin: 0; color: var(--muted); font-size: 16px; max-width: 40em; }
.hero .stats { margin-top: 14px; font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 32px; align-items: start; }

/* filters */
.filters { display: grid; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid var(--rule); }
.seg { display: inline-flex; background: var(--tile); border-radius: 10px; padding: 3px; gap: 2px; width: max-content; }
.seg button { border: 0; background: transparent; padding: 4px 13px; border-radius: 8px; font-size: 13.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 2px 11px; font-size: 13px; color: var(--ink); }
.chip .c { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-left: 4px; }
.chip[aria-pressed="true"] { background: var(--soft); border-color: var(--soft-2); color: var(--acc); font-weight: 600; }
.chip[aria-pressed="true"] .c { color: var(--acc); }
.count { font-family: var(--mono); font-size: 12px; color: var(--muted); }

/* day + cards */
.day { padding-top: 26px; }
.day h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; display: flex; gap: 10px; align-items: baseline; }
.day h2 span { font-family: var(--mono); font-weight: 400; font-size: 12px; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 16px; margin-bottom: 10px; display: grid; grid-template-columns: 44px minmax(0, 1fr) 96px; gap: 14px; box-shadow: var(--shadow); }
.fav { width: 44px; height: 44px; border-radius: 11px; background: var(--tile); color: var(--muted); display: grid; place-items: center; font-family: var(--mono); font-weight: 500; font-size: 17px; text-transform: lowercase; }
.card.k-research .fav { background: var(--soft); color: var(--acc); }
.kick { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.kick .ty { color: var(--acc); font-weight: 600; }
.card.k-explainer .kick .ty { color: var(--muted); }
.card h3 { margin: 2px 0 4px; font-size: 16.5px; line-height: 1.35; font-weight: 650; overflow-wrap: anywhere; }
.sum { margin: 0 0 8px; color: var(--ink); opacity: .86; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.dom { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.tag { font-family: var(--mono); font-size: 11px; border-radius: 5px; padding: 0 6px; background: var(--tile); color: var(--muted); line-height: 1.75; }
.tag.hot { background: var(--soft); color: var(--acc); }
.via { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 6px; }
.pill { font-family: var(--mono); font-size: 11px; border: 1px solid var(--rule); border-radius: 999px; padding: 0 8px; line-height: 1.8; color: var(--ink); white-space: nowrap; }
.acts { display: grid; gap: 6px; align-content: start; }
.act { border: 1px solid var(--rule); background: transparent; border-radius: 10px; padding: 5px 0 4px; font-size: 11.5px; color: var(--muted); display: grid; justify-items: center; line-height: 1.3; }
.act strong { font-family: var(--mono); font-size: 16px; font-weight: 500; color: var(--ink); }
.act.has { border-color: var(--soft-2); background: var(--soft); color: var(--acc); }
.act.has strong { color: var(--acc); }
.act[disabled] { cursor: default; opacity: .7; }
.act.save[aria-pressed="true"] { border-color: var(--soft-2); color: var(--acc); background: var(--soft); }
.act.save svg { width: 14px; height: 14px; }
.more { margin-top: 16px; border: 1px solid var(--rule); background: var(--surface); border-radius: 10px; padding: 8px 18px; font-size: 14px; }
.empty { padding: 40px 0; color: var(--muted); }

/* thread: answers branch off the post */
.thread { grid-column: 2 / 4; margin-top: 2px; }
.thread ol { list-style: none; margin: 0; padding: 0 0 0 24px; position: relative; display: grid; gap: 8px; }
.thread ol::before { content: ""; position: absolute; left: 6px; top: -6px; bottom: 18px; width: 2px; background: var(--brand); border-radius: 2px; opacity: .8; }
.thread li { position: relative; border: 1px solid var(--rule); border-radius: 10px; padding: 8px 12px; background: var(--paper); }
.thread li::before { content: ""; position: absolute; left: -18px; top: 17px; width: 17px; height: 2px; background: var(--rel); opacity: .8; }
.thread li::after { content: ""; position: absolute; left: -23px; top: 13px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--rel); }
.thread .rm { font-family: var(--mono); font-size: 11.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.thread .rel { color: var(--rel); font-weight: 500; }
.thread .rt { font-weight: 600; font-size: 14px; line-height: 1.4; }
.thread .rs { margin: 2px 0 0; font-size: 13.5px; color: var(--muted); }
.thread .tog { border: 0; background: none; color: var(--acc); font-size: 13px; padding: 6px 0 0 24px; }
.r-rebuttal { --rel: var(--rebuttal); } .r-replication { --rel: var(--replication); } .r-extension { --rel: var(--extension); } .r-discussion { --rel: var(--discussion); }

/* sidebar */
aside { display: grid; gap: 14px; position: sticky; top: 76px; padding-top: 4px; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
.panel h4 { margin: 0 0 6px; font-size: 14.5px; }
.panel p { margin: 0 0 10px; font-size: 13.5px; color: var(--muted); }
.panel .wide { width: 100%; border: 1px solid var(--soft-2); background: var(--soft); color: var(--acc); border-radius: 10px; padding: 8px; font-weight: 600; font-size: 14px; }
.panel ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; font-size: 13.5px; }
.panel li small { display: block; font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.panel li button { border: 0; background: none; padding: 0; text-align: left; font-weight: 600; }
.ch { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: baseline; }
.ch .bar-s { grid-column: 1 / 3; height: 4px; border-radius: 4px; background: var(--tile); overflow: hidden; }
.ch .bar-s i { display: block; height: 100%; background: var(--brand); border-radius: 4px; }
.ch .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }

/* submit dialog */
dialog { border: 1px solid var(--rule); border-radius: 16px; padding: 0; width: min(720px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0, 0, 0, .18); }
dialog::backdrop { background: rgba(20, 24, 22, .32); }
.dlg { display: grid; grid-template-columns: minmax(0, 1fr) 230px; }
.dlg form { padding: 22px; display: grid; gap: 6px; }
.dlg h3 { margin: 0 0 8px; font-size: 19px; }
.tabs { display: inline-flex; background: var(--tile); border-radius: 10px; padding: 3px; width: max-content; margin-bottom: 6px; }
.tabs button { border: 0; background: transparent; border-radius: 8px; padding: 4px 14px; font-size: 13.5px; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }
.dlg label { font-size: 13.5px; font-weight: 600; margin-top: 6px; }
.dlg label span { font-weight: 400; color: var(--muted); }
.dlg input[type=url], .dlg textarea { font: inherit; font-size: 14px; border: 1px solid var(--rule-2); border-radius: 10px; padding: 8px 10px; background: var(--paper); color: var(--ink); width: 100%; }
.dlg textarea { min-height: 64px; resize: vertical; }
.dlg .chk { font-size: 13.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; margin-top: 4px; }
.dlg .btns { display: flex; gap: 8px; margin-top: 10px; }
.dlg .btns button { border-radius: 10px; padding: 7px 16px; font-size: 14px; border: 1px solid var(--rule); background: transparent; }
.dlg .btns .primary { border-color: var(--soft-2); background: var(--soft); color: var(--acc); font-weight: 600; }
.dlg .side { background: var(--paper); border-left: 1px solid var(--rule); padding: 22px 18px; border-radius: 0 16px 16px 0; }
.dlg ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; counter-reset: s; font-size: 13.5px; }
.dlg ol li { counter-increment: s; display: grid; grid-template-columns: 22px 1fr; gap: 8px; }
.dlg ol li::before { content: counter(s); width: 22px; height: 22px; border-radius: 50%; background: var(--soft); color: var(--acc); font-family: var(--mono); font-size: 12px; display: grid; place-items: center; }
.dlg ol small { display: block; color: var(--muted); font-size: 12.5px; }
.done { padding: 12px 14px; border-radius: 10px; background: var(--soft); color: var(--ink); font-size: 14px; margin-top: 10px; }

@media (max-width: 920px) {
  .cols { grid-template-columns: minmax(0, 1fr); }
  aside { position: static; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .nav { display: none; }
}
@media (max-width: 600px) {
  .bar-in { flex-wrap: wrap; gap: 10px; padding: 10px 16px; }
  .search { order: 3; max-width: none; flex-basis: 100%; }
  .shell { padding: 0 16px 60px; }
  .hero { padding: 28px 0 18px; } .hero h1 { font-size: 26px; }
  .card { grid-template-columns: 36px minmax(0, 1fr); gap: 12px; padding: 14px; }
  .fav { width: 36px; height: 36px; font-size: 15px; border-radius: 9px; }
  .acts { grid-column: 2; grid-auto-flow: column; justify-content: start; }
  .act { padding: 3px 12px; grid-auto-flow: column; gap: 5px; align-items: baseline; }
  .act strong { font-size: 13px; }
  .thread { grid-column: 1 / 3; }
  .dlg { grid-template-columns: 1fr; } .dlg .side { border-left: 0; border-top: 1px solid var(--rule); border-radius: 0 0 16px 16px; }
}
</style>
</head>

<main class="shell">

</main>

<dialog id="dlg"><div class="dlg">

    <h3 id="d-h"></h3>

    <label for="d-why" id="d-why-l"></label><textarea id="d-why"></textarea>
    <label class="chk"><input type="checkbox" id="d-author"><span id="d-author-l"></span></label>
    <div class="btns"><button class="primary" id="d-send" type="submit"></button><button id="d-cancel" type="button"></button></div>
    <div class="done" id="d-done" hidden></div>
  </form>
  <div class="side"><ol id="d-steps"></ol></div>
</div></dialog>
