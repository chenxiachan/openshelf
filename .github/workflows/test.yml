name: test
# On every push and pull request: offline Python tests, the Worker tests, and a headless Chrome test that clicks every
# control on the built site. No network beyond package installs, no API keys.
on:
  push:
    branches: [main]
    paths-ignore: ["site/issues/live.json", "state/**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Python tests (also builds the site)
        run: python3 -m unittest discover -s tests -v
      - name: Worker tests
        run: node worker/test/e2e.test.mjs
      - name: Browser test
        run: |
          (cd tests/browser && npm ci --no-audit --no-fund)
          node tests/browser/smoke.mjs
