name: watchdog
# Starts the daily run when none has succeeded today, and opens an "alert" issue when the daily run has not succeeded
# for 36 hours or the live site is that old. Twice a day, because GitHub sometimes skips a scheduled run.
# Run it by hand with "test alert" ticked to check that alert emails reach you.
on:
  schedule:
    - cron: "41 13 * * *"
    - cron: "41 21 * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Open a test alert issue"
        type: boolean
        default: false
permissions:
  actions: write
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the daily run and the live site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DAILY_WORKFLOW: daily.yml
          WATCHDOG_MAX_HOURS: "36"
          ALERT_MENTION: ${{ github.repository_owner }}
          OPENSHELF_PIPELINE_TOKEN: ${{ secrets.OPENSHELF_PIPELINE_TOKEN }}
        run: python3 pipeline/watchdog.py ${{ inputs.test_alert && '--test-alert' || '' }}
