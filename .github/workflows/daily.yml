name: daily
# Collect new posts, label them, link responses, then save the dataset and redeploy the site.
# Errors open an "alert" issue (pipeline/runlog.py); a failed run also triggers GitHub's own failure email.
on:
  schedule:                   # every six hours; each run takes only what is new since the last one (state/state.json).
    - cron: "23 3 * * *"      # The Worker's cron (worker/src/index.js) starts these on time; GitHub's own schedule, often
                              # hours late or skipped, is the backup. A run started twice costs nothing.
    - cron: "23 9 * * *"
    - cron: "23 15 * * *"
    - cron: "23 21 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect, label and link
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          ALERT_GITHUB_REPO: ${{ github.repository }}
          ALERT_MENTION: ${{ github.repository_owner }}
        run: python3 pipeline/daily.py
      - name: Save dataset and state
        run: |
          git config user.name "openshelf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/issues/live.json state/ sources/
          git diff --cached --quiet || git commit -q -m "daily: $(date -u '+%F %H:%M')"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 10; done; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Browser test before deploy
        id: browser
        run: |
          python3 site/build_openshelf.py
          (cd tests/browser && npm ci --no-audit --no-fund)
          node tests/browser/smoke.mjs
      - name: Alert when the browser test fails (the live site keeps the last good version)
        if: failure() && steps.browser.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALERT_GITHUB_REPO: ${{ github.repository }}
          ALERT_MENTION: ${{ github.repository_owner }}
        run: >
          python3 -c "import sys; sys.path.insert(0, 'pipeline'); from runlog import alert;
          alert('[deploy] the browser test failed, the site was not deployed', 'The data was collected and saved, but the built site failed the headless Chrome test (tests/browser/smoke.mjs), so it was not deployed. '
          'The live site keeps its last good version. Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}')"
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: sh site/deploy_pages.sh
      - name: Check that the live site updated
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALERT_MENTION: ${{ github.repository_owner }}
        run: python3 pipeline/watchdog.py --site --wait 600
      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log
          path: data/logs/
          retention-days: 30
